<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Price Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .container {
      background: white;
      border-radius: 0;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-size: 20px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .settings-button {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 16px;
    }

    .settings-button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(45deg);
    }

    .content {
      padding: 20px;
    }

    .place-info {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .place-name {
      font-weight: 600;
      font-size: 14px;
      color: #333;
      margin-bottom: 4px;
    }

    .place-address {
      font-size: 12px;
      color: #666;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .price-input-wrapper {
      position: relative;
    }

    .price-input-wrapper::before {
      content: attr(data-symbol);
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #666;
      font-weight: 500;
    }

    .price-input-wrapper input {
      padding-left: 32px;
    }

    .button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .stats {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
      text-align: center;
    }

    .stats-title {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stats-price {
      font-size: 28px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 4px;
    }

    .stats-count {
      font-size: 13px;
      color: #888;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .success {
      background: #efe;
      color: #3a3;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .not-on-maps {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .not-on-maps-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .setup-needed {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 12px;
      margin: 16px;
      font-size: 13px;
      color: #856404;
    }

    .setup-needed strong {
      display: block;
      margin-bottom: 4px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .currency-badge {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>☕ How much for a Cup of Joe?</h1>
      <p>Help the community find (Cheap) great coffee</p>
    </div>

    <div class="content">


      <div id="mainContent">
        <form id="settingsForm">
          <div class="form-group">
            <label>
              Preferred Currency
            </label>
            <select id="preferredCurrency" class="currency-select">
              <option value="none">None (show local currency only)</option>
              <option value="EUR" selected>Euro (€)</option>
              <option value="USD">US Dollar ($)</option>
            </select>
          </div>

          <button type="submit" class="button">
            Save Settings
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
